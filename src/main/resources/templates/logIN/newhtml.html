<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión</title>

 
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" />
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.0/css/all.min.css}" />
</head>
<body class="bg-light">

  <div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow-sm" style="max-width: 420px; width:100%;">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <i class="fa-solid fa-user-lock fa-2xl mb-2"></i>
          <h4 class="mb-0">Iniciar sesión</h4>
        </div>

        
        <div th:if="${param.error}" class="alert alert-danger py-2">
          Usuario o contraseña inválidos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2">
          Sesión finalizada correctamente.
        </div>

   
        <form th:action="@{/login}" method="post" class="mt-3">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input id="username" name="username" type="text" class="form-control" required autofocus />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" name="password" type="password" class="form-control" required />
          </div>

     
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <button class="btn btn-primary w-100" type="submit">
            <i class="fa-solid fa-right-to-bracket me-1"></i> Entrar
          </button>
        </form>

        <div class="text-center mt-3">
          <a th:href="@{/}"><i class="fa-solid fa-house"></i> Ir al inicio</a>
        </div>
      </div>
    </div>
  </div>


  <script th:src="@{/webjars/jquery/3.6.4/jquery.min.js}"></script>
  <script th:src="@{/webjars/bootstrap/5.2.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
